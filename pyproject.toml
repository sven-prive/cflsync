[project]
name = "cflsync"
version = "0.3.1"
description = "Synchronize Confluence Cloud pages with local Markdown page directories"
readme = "README.md"
authors = [
    { name = "Sven Rosiers", email = "github-sro@rosiers.info" },
]
license = "MPL-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.3.8",
    "tzdata>=2025.2",
    "tzlocal>=5.3",
]

[project.scripts]
cflsync = "cflsync.cli:main"

[project.urls]
Repository = "https://github.com/sven-prive/cflsync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "yapf>=0.43",
]

[tool.yapf]
based_on_style = "pep8"
blank_line_before_module_docstring = true
column_limit = 132
indent_width = 4
continuation_indent_width = 4
continuation_align_style = "SPACE"
split_before_first_argument = true
split_before_closing_bracket = false
disable_ending_comma_heuristic = true
dedent_closing_brackets = false
indent_closing_brackets = false

[tool.zuban]
python_executable = ".venv/bin/python"

# Tests reshape literal JSON fixtures and inspect converter output by index, which the checker cannot follow without
# local annotations. These codes stay enabled for application source; calls into the public API remain checked.
[[tool.zuban.overrides]]
module = ["tests.*"]
disable_error_code = ["index", "assignment", "call-overload", "var-annotated"]
