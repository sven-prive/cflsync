# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
## cflsync {{ version }}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} **(breaking change)**{% endif %}
{% endfor %}

{% endfor %}
"""
footer = """
---

This release contains Object Code under the Mozilla Public License, version 2.0.

The corresponding Source Code Form is available at https://github.com/sven-prive/cflsync
under the [Mozilla Public License 2.0](https://github.com/sven-prive/cflsync/blob/main/LICENSE.md).
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", skip = true },
    { message = "^build", skip = true },
    { message = "^ci", skip = true },
    { message = "^chore", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
