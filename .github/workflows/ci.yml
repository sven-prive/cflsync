name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must provide the native JSON API version pinned in cflsync/convert.py.
  PANDOC_VERSION: "3.10"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform; a Windows failure must not hide a macOS one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ env.PANDOC_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Verify the pinned Pandoc API version
        run: uv run --group dev python -c "from cflsync.convert import PandocRunner; runner = PandocRunner(); print(runner.binary, runner.version, runner.API_VERSION)"

      - name: Run the test suite
        run: uv run --group dev python -m unittest discover -s tests -v

  checks:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Type checking runs out-of-band: zuban is a developer tool installed
      # separately, deliberately not a project dependency.
      - name: Check formatting
        run: uv run --group dev python -m yapf --recursive --diff cflsync tests
