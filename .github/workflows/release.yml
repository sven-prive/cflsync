name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Verify tag and project versions agree
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv run python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "tag version '$tag_version' does not match pyproject.toml version '$project_version'" >&2
            exit 1
          fi
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Build zipapp
        run: uv run python packaging/scripts/build_zipapp.py

      - name: Build Windows release archives
        run: |
          uv run python packaging/scripts/build_windows_zip.py x64
          uv run python packaging/scripts/build_windows_zip.py arm64

      - name: Assemble release archive and checksum
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archives=(
            "dist/cflsync-${VERSION}-windows-x64.zip"
            "dist/cflsync-${VERSION}-windows-arm64.zip"
          )
          assets=()
          for archive in "${archives[@]}"; do
            checksum="${archive}.sha256"
            digest="$(sha256sum "$archive")"
            printf '%s  %s\n' "${digest%% *}" "$(basename "$archive")" > "$checksum"
            assets+=("$archive" "$checksum")
          done
          echo "assets=${assets[*]}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md

      - name: Publish GitHub Release
        env:
          ASSETS: ${{ steps.package.outputs.assets }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          read -r -a assets <<< "$ASSETS"
          gh release create "$TAG" "${assets[@]}" --title "cflsync $VERSION" --notes-file release-notes.md
